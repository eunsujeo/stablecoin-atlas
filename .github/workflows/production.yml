name: Atlas CI release
run-name: ${{ inputs.component || 'web' }} / ${{ github.sha }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Explicit independent deployment (collector/usage require server policy approval)
        type: choice
        options: [web, collector, usage]
        default: web
permissions:
  contents: read
concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-build:
    # Hosted, disposable ARM64 CI. Never install a runner on the production Mac mini.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      COMPONENT: ${{ inputs.component || 'web' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '25.2.1'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.7.1
          cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the existing hash-pinned local compiler for isolated fixtures
        run: npm run compiler:prepare
      - run: npm run doctor:full
      - name: Full regression (bounded concurrency; fixtures only)
        run: |
          if npm run check > ci-check.log 2>&1; then
            tail -12 ci-check.log
          else
            grep -n -E -C 14 'not ok|^✖|AssertionError|error:|failureType:' ci-check.log | tail -260 || true
            tail -40 ci-check.log
            exit 1
          fi
      - name: Owned PostgreSQL deployment and reader fixtures (no production credentials)
        run: |
          docker pull postgres:17-alpine
          node --test --test-concurrency=1 tests/postgres/deployment-gate.test.mjs tests/postgres/production.test.mjs tests/postgres/network-usage-v2.test.mjs
      - name: Router regression (no model, credentials or Herdr required)
        run: python3 -m unittest discover -s tools/intelligent-router/evaluation -p 'test_*.py'
      - name: Summarize regression
        if: always()
        run: |
          if [ -f ci-check.log ]; then
            tail -30 ci-check.log >> "$GITHUB_STEP_SUMMARY"
          fi
      # The archived Allium sandbox needs the tested Node25 network permission boundary.
      # Production remains Node24; verify its web/deployment paths independently before building.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify deployment unit syntax without starting services
        run: |
          # Hosted ARM64 toolcache has Node on PATH but no /usr/bin/node. Provision only this disposable CI host.
          if [ ! -e /usr/bin/node ]; then sudo ln -s "$(command -v node)" /usr/bin/node; fi
          systemd-analyze verify deploy/atlas-deploy-apply.service deploy/atlas-deploy-agent.service deploy/atlas-deploy-agent.timer deploy/atlas-usage.service deploy/atlas-usage.timer
      - name: Production Node24 web and deployment regression
        run: node --use-env-proxy --test --test-concurrency=2 tests/deploy-automation.test.mjs tests/production*.test.mjs web/*.test.mjs
      - name: Build immutable Linux ARM64 runtime bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
          CI_RUN: ${{ github.run_id }}
          CI_ATTEMPT: ${{ github.run_attempt }}
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node tools/deploy/build.mjs .state/ci-release "$COMPONENT" "$REVISION" "$CI_RUN" "$CI_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: atlas-${{ env.COMPONENT }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .state/ci-release/release.json
            .state/ci-release/release.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Deployment is pulled by the independently bootstrapped server
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo 'CI artifact is ready. The production broker verifies this completed run, exact main SHA and artifact digest; no SSH or production credentials are used by this job.' >> "$GITHUB_STEP_SUMMARY"
